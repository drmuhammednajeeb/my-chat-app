<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ultra Chat Pro</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap');
    
    * {
      font-family: 'Tajawal', -apple-system, sans-serif;
      box-sizing: border-box;
    }

    body {
      background-color: #0b0f19;
      color: #f8fafc;
      margin: 0;
      padding: 0;
    }

    /* Ultra Glassmorphism Card */
    .glass-panel {
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .glass-header {
      background: rgba(30, 41, 59, 0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s ease;
    }
    .glass-input:focus-within {
      border-color: #3b82f6;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.3);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Animations */
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop-in {
      animation: popIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .typing-dot {
      animation: typingBlink 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: 0s; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes typingBlink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen h-dvh flex items-center justify-center p-0 md:p-4 overflow-hidden antialiased selection:bg-blue-600 selection:text-white">

  <!-- Main Container -->
  <div class="glass-panel w-full max-w-4xl h-full md:h-[94vh] md:rounded-3xl flex flex-col relative overflow-hidden shadow-2xl border border-slate-800">
    
    <!-- Top Bar Navigation -->
    <header class="glass-header px-4 py-3 flex flex-col gap-3 shrink-0 z-20">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="relative">
            <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-500/30 text-white font-bold text-xl">
              <i class="ph-bold ph-chats-circle"></i>
            </div>
            <span id="statusIndicator" class="absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-slate-500 border-2 border-slate-900 rounded-full transition-all duration-300"></span>
          </div>
          <div>
            <h1 class="font-black text-base md:text-lg text-white leading-tight flex items-center gap-2">
              Ultra Chat Pro
              <span id="roomBadge" class="bg-blue-500/15 text-blue-400 border border-blue-500/30 text-xs px-2.5 py-0.5 rounded-full font-bold">general</span>
            </h1>
            <p id="connectionText" class="text-xs text-slate-400 font-medium">جاري المزامنة مع السيرفر...</p>
          </div>
        </div>

        <!-- Controls Toolbar -->
        <div class="flex items-center gap-2">
          <button id="aiBotBtn" class="px-3 py-1.5 rounded-xl bg-purple-500/10 border border-purple-500/30 text-purple-300 hover:bg-purple-500/20 text-xs font-bold flex items-center gap-1.5 transition-all" title="تفعيل رد المساعد الآلي">
            <i class="ph-bold ph-robot text-sm"></i>
            <span class="hidden sm:inline">الرد الآلي</span>
          </button>

          <button id="soundToggleBtn" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center transition-colors border border-slate-700/50" title="الصوت">
            <i id="soundIcon" class="ph-bold ph-bell text-base"></i>
          </button>
          
          <button id="clearChatBtn" class="w-9 h-9 rounded-xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-rose-400 flex items-center justify-center transition-colors border border-slate-700/50" title="مسح المحادثة">
            <i class="ph-bold ph-trash text-base"></i>
          </button>
        </div>
      </div>

      <!-- User & Room Settings Row -->
      <div class="grid grid-cols-2 gap-2">
        <div class="glass-input rounded-xl px-3 py-1.5 flex items-center gap-2">
          <i class="ph-bold ph-user-circle text-slate-400 text-base"></i>
          <span class="text-xs text-slate-400 whitespace-nowrap font-medium">أنا:</span>
          <input type="text" id="usernameInput" placeholder="اسمك..." class="w-full bg-transparent border-none outline-none text-xs md:text-sm text-slate-100 placeholder-slate-500 font-semibold" autocomplete="off">
        </div>
        <div class="glass-input rounded-xl px-3 py-1.5 flex items-center gap-2">
          <i class="ph-bold ph-planet text-slate-400 text-base"></i>
          <span class="text-xs text-slate-400 whitespace-nowrap font-medium">الغرفة:</span>
          <input type="text" id="roomInput" placeholder="general" value="general" class="w-full bg-transparent border-none outline-none text-xs md:text-sm text-slate-100 placeholder-slate-500 font-semibold" autocomplete="off">
        </div>
      </div>
    </header>

    <!-- Toast Notification Banner -->
    <div id="toastBanner" class="absolute top-28 left-1/2 -translate-x-1/2 bg-rose-500/90 backdrop-blur-md text-white text-xs font-extrabold px-4 py-2 rounded-full shadow-lg z-30 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2">
      تنبيه النظام
    </div>

    <!-- Main Messages Feed -->
    <main id="messagesContainer" class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-3.5 relative">
      <!-- Loading Indicator -->
      <div id="loadingState" class="m-auto flex flex-col items-center gap-2 text-slate-400">
        <div class="w-8 h-8 border-3 border-blue-500/30 border-t-blue-500 rounded-full animate-spin"></div>
        <span class="text-xs font-semibold">جاري جلب الرسائل...</span>
      </div>

      <!-- Empty Chat State -->
      <div id="emptyState" class="hidden m-auto flex flex-col items-center gap-3 text-slate-500 my-auto py-12">
        <div class="w-16 h-16 rounded-3xl bg-slate-800/50 flex items-center justify-center text-3xl text-slate-500 border border-slate-700/50">
          <i class="ph-bold ph-chats-teardrop"></i>
        </div>
        <p class="text-sm font-semibold text-center leading-relaxed">لا توجد رسائل في هذه الغرفة بعد.<br>كن أول من يرسل!</p>
      </div>
    </main>

    <!-- Typing Indicator -->
    <div id="typingContainer" class="px-6 py-1 h-6 flex items-center gap-2 text-xs text-slate-400 font-medium transition-opacity duration-200 opacity-0">
      <div class="flex items-center gap-1">
        <span class="w-1.5 h-1.5 rounded-full bg-blue-400 typing-dot"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-blue-400 typing-dot"></span>
        <span class="w-1.5 h-1.5 rounded-full bg-blue-400 typing-dot"></span>
      </div>
      <span id="typingText">أحدهم يكتب الآن...</span>
    </div>

    <!-- Image Preview Container -->
    <div id="imagePreviewBox" class="hidden px-4 py-2 bg-slate-900/90 border-t border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <img id="imagePreview" src="" alt="معاينة" class="w-10 h-10 object-cover rounded-lg border border-slate-700">
        <span class="text-xs text-slate-300 font-medium">مرفق صورة جاهز للإرسال</span>
      </div>
      <button id="cancelImageBtn" class="text-slate-400 hover:text-rose-400 text-xs font-bold p-1">إلغاء المرفق</button>
    </div>

    <!-- Bottom Input Dock -->
    <footer class="glass-header px-4 py-3 border-t border-slate-800/80 shrink-0">
      <div class="flex items-end gap-2">
        <!-- Image Upload Button -->
        <label class="w-11 h-11 rounded-2xl bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white flex items-center justify-center cursor-pointer transition-colors border border-slate-700/50 shrink-0" title="إرفاق صورة">
          <i class="ph-bold ph-image text-lg"></i>
          <input type="file" id="imageInput" accept="image/*" class="hidden">
        </label>

        <!-- Message Box -->
        <div class="glass-input flex-1 rounded-2xl px-4 py-2 flex items-center min-h-[46px] max-h-32">
          <textarea id="messageInput" placeholder="اكتب رسالتك هنا..." rows="1" class="w-full bg-transparent border-none outline-none text-sm text-slate-100 placeholder-slate-500 resize-none max-h-28 overflow-y-auto" autocomplete="off"></textarea>
        </div>

        <!-- Submit Button -->
        <button id="sendBtn" disabled class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-blue-600 via-indigo-600 to-purple-600 hover:brightness-110 disabled:opacity-40 disabled:cursor-not-allowed text-white flex items-center justify-center shadow-lg shadow-blue-500/25 transition-all duration-200 active:scale-95 shrink-0">
          <i class="ph-bold ph-paper-plane-right text-lg"></i>
        </button>
      </div>
    </footer>

  </div>

  <!-- JavaScript App Logic -->
  <script>
    const SUPABASE_URL = 'https://lvkeohpuocuklagvwpnq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_3OM0vlZU0dkqK4X6aoGZsA_ZBawbyDR';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Elements
    const messagesContainer = document.getElementById('messagesContainer');
    const usernameInput = document.getElementById('usernameInput');
    const roomInput = document.getElementById('roomInput');
    const messageInput = document.getElementById('messageInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusIndicator = document.getElementById('statusIndicator');
    const connectionText = document.getElementById('connectionText');
    const roomBadge = document.getElementById('roomBadge');
    const typingContainer = document.getElementById('typingContainer');
    const typingText = document.getElementById('typingText');
    const loadingState = document.getElementById('loadingState');
    const emptyState = document.getElementById('emptyState');
    const soundToggleBtn = document.getElementById('soundToggleBtn');
    const soundIcon = document.getElementById('soundIcon');
    const clearChatBtn = document.getElementById('clearChatBtn');
    const toastBanner = document.getElementById('toastBanner');
    const imageInput = document.getElementById('imageInput');
    const imagePreviewBox = document.getElementById('imagePreviewBox');
    const imagePreview = document.getElementById('imagePreview');
    const cancelImageBtn = document.getElementById('cancelImageBtn');
    const aiBotBtn = document.getElementById('aiBotBtn');

    // State
    let isMuted = false;
    let isAiBotActive = false;
    let attachedImageData = null;
    let typingTimer = null;
    let activeChannel = null;
    const loadedMessageIds = new Set();

    function sanitizeHTML(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function showToast(msg, isError = true) {
      toastBanner.textContent = msg;
      toastBanner.className = `absolute top-28 left-1/2 -translate-x-1/2 ${isError ? 'bg-rose-500/90 shadow-rose-500/20' : 'bg-emerald-500/90 shadow-emerald-500/20'} backdrop-blur-md text-white text-xs font-extrabold px-4 py-2 rounded-full shadow-lg z-30 transition-all duration-300 opacity-100 transform translate-y-0`;
      setTimeout(() => {
        toastBanner.className = 'absolute top-28 left-1/2 -translate-x-1/2 bg-rose-500/90 backdrop-blur-md text-white text-xs font-extrabold px-4 py-2 rounded-full shadow-lg z-30 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-2';
      }, 3500);
    }

    function playNotificationSound(pitch = 587.33) {
      if (isMuted) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(pitch, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          attachedImageData = event.target.result;
          imagePreview.src = attachedImageData;
          imagePreviewBox.classList.remove('hidden');
          validateInputs();
        };
        reader.readAsDataURL(file);
      }
    });

    cancelImageBtn.addEventListener('click', () => {
      attachedImageData = null;
      imageInput.value = '';
      imagePreviewBox.classList.add('hidden');
      validateInputs();
    });

    function initStorage() {
      usernameInput.value = localStorage.getItem('ultra_max_user') || '';
      roomInput.value = localStorage.getItem('ultra_max_room') || 'general';
      validateInputs();
    }

    usernameInput.addEventListener('input', () => {
      localStorage.setItem('ultra_max_user', usernameInput.value.trim());
      validateInputs();
    });

    roomInput.addEventListener('change', () => {
      const room = roomInput.value.trim() || 'general';
      localStorage.setItem('ultra_max_room', room);
      roomBadge.textContent = room;
      initChatChannel();
    });

    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = `${Math.min(messageInput.scrollHeight, 112)}px`;
      validateInputs();
      triggerTypingSignal();
    });

    function validateInputs() {
      const hasUser = usernameInput.value.trim().length > 0;
      const hasMsg = messageInput.value.trim().length > 0 || attachedImageData !== null;
      sendBtn.disabled = !(hasUser && hasMsg);
    }

    function renderMessage(msg) {
      if (msg.id && loadedMessageIds.has(msg.id)) return;
      if (msg.id) loadedMessageIds.add(msg.id);

      if (loadingState) loadingState.remove();
      if (emptyState) emptyState.classList.add('hidden');

      const currentUser = usernameInput.value.trim();
      const isMine = msg.sender === currentUser;
      const isBot = msg.sender === 'المساعد الذكي (AI)';

      const wrapper = document.createElement('div');
      wrapper.className = `flex flex-col ${isMine ? 'items-end self-end' : 'items-start self-start'} animate-pop-in max-w-[85%] md:max-w-[75%]`;

      const formattedTime = msg.created_at
        ? new Date(msg.created_at).toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })
        : new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });

      let imageHtml = '';
      if (msg.image_url) {
        imageHtml = `<img src="${msg.image_url}" class="rounded-xl max-h-52 w-full object-cover mb-2 border border-slate-700/50" loading="lazy">`;
      }

      wrapper.innerHTML = `
        <span class="text-[10px] ${isBot ? 'text-purple-400 font-bold' : 'text-slate-400 font-semibold'} px-1 mb-1 flex items-center gap-1">
          ${isBot ? '<i class="ph-bold ph-robot"></i>' : ''}
          ${sanitizeHTML(msg.sender || 'مجهول')}
        </span>
        <div class="px-4 py-2.5 rounded-2xl text-sm leading-relaxed break-words whitespace-pre-wrap shadow-md ${
          isMine 
            ? 'bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600 text-white rounded-tl-sm' 
            : isBot 
              ? 'bg-purple-900/40 border border-purple-500/30 text-purple-100 rounded-tr-sm'
              : 'bg-slate-800/90 border border-slate-700/50 text-slate-100 rounded-tr-sm'
        }">
          ${imageHtml}
          ${sanitizeHTML(msg.content)}
          <div class="flex items-center justify-end gap-1 text-[9px] opacity-75 mt-1 select-none">
            <span>${formattedTime}</span>
            ${isMine ? '<i class="ph-bold ph-check-double text-blue-200 text-xs"></i>' : ''}
          </div>
        </div>
      `;

      messagesContainer.appendChild(wrapper);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;

      if (!isMine) {
        playNotificationSound(isBot ? 880 : 587.33);
      }
    }

    async function loadRoomMessages() {
      messagesContainer.innerHTML = '';
      messagesContainer.appendChild(loadingState);
      loadedMessageIds.clear();

      const currentRoom = roomInput.value.trim() || 'general';
      roomBadge.textContent = currentRoom;

      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .or(`receiver.eq.${currentRoom},receiver.is.null`)
        .order('created_at', { ascending: true });

      if (loadingState) loadingState.remove();

      if (error) {
        showToast('تعذر جلب الرسائل السابقة');
        return;
      }

      if (!data || data.length === 0) {
        emptyState.classList.remove('hidden');
        messagesContainer.appendChild(emptyState);
      } else {
        data.forEach(renderMessage);
      }
    }

    async function handleSendMessage() {
      const sender = usernameInput.value.trim();
      const receiver = roomInput.value.trim() || 'general';
      const content = messageInput.value.trim();
      const imageData = attachedImageData;

      if (!sender || (!content && !imageData)) {
        showToast('يرجى كتابة نص الرسالة أو إرفاق صورة');
        return;
      }

      messageInput.value = '';
      messageInput.style.height = 'auto';
      attachedImageData = null;
      imageInput.value = '';
      imagePreviewBox.classList.add('hidden');
      validateInputs();

      const payload = { sender, receiver, content };
      if (imageData) payload.image_url = imageData;

      const { error } = await supabaseClient
        .from('messages')
        .insert([payload]);

      if (error) {
        showToast('تعذر إرسال الرسالة إلى السيرفر');
      } else if (isAiBotActive) {
        setTimeout(() => triggerAiReply(content, receiver), 1200);
      }
    }

    async function triggerAiReply(userPrompt, currentRoom) {
      const aiReplies = [
        "تم استلام رسالتك بنجاح! 🚀",
        "تطبيق المحادثة الفورية يعمل بكفاءة وتجاوب عالي.",
        "تم تسجيل تفاعلك في القناة " + currentRoom,
        "أنا المساعد الذكي، متواجد لتأكيد سرعة الإرسال والاستقبال!"
      ];
      const selectedReply = aiReplies[Math.floor(Math.random() * aiReplies.length)];

      await supabaseClient
        .from('messages')
        .insert([{
          sender: 'المساعد الذكي (AI)',
          receiver: currentRoom,
          content: selectedReply
        }]);
    }

    function initChatChannel() {
      if (activeChannel) {
        supabaseClient.removeChannel(activeChannel);
      }

      const room = roomInput.value.trim() || 'general';

      connectionText.textContent = 'جاري الاتصال...';
      statusIndicator.className = 'absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-amber-500 border-2 border-slate-900 rounded-full';

      activeChannel = supabaseClient.channel(`room:${room}`)
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
          renderMessage(payload.new);
        })
        .on('broadcast', { event: 'typing' }, (payload) => {
          if (payload.payload.sender !== usernameInput.value.trim()) {
            displayTypingNotice(payload.payload.sender);
          }
        })
        .subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            statusIndicator.className = 'absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-emerald-500 border-2 border-slate-900 rounded-full shadow-[0_0_8px_#10b981]';
            connectionText.textContent = 'متصل بنجاح (Realtime)';
          } else {
            statusIndicator.className = 'absolute -bottom-0.5 -right-0.5 w-3.5 h-3.5 bg-blue-500 border-2 border-slate-900 rounded-full';
            connectionText.textContent = 'متصل (تحديث تلقائي)';
          }
        });

      loadRoomMessages();
    }

    function triggerTypingSignal() {
      if (!activeChannel) return;
      try {
        activeChannel.send({
          type: 'broadcast',
          event: 'typing',
          payload: { sender: usernameInput.value.trim() }
        });
      } catch (e) {}
    }

    function displayTypingNotice(author) {
      typingText.textContent = `${author || 'أحدهم'} يكتب الآن...`;
      typingContainer.style.opacity = '1';
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        typingContainer.style.opacity = '0';
      }, 2200);
    }

    sendBtn.addEventListener('click', handleSendMessage);

    messageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        if (!sendBtn.disabled) handleSendMessage();
      }
    });

    aiBotBtn.addEventListener('click', () => {
      isAiBotActive = !isAiBotActive;
      aiBotBtn.className = isAiBotActive 
        ? 'px-3 py-1.5 rounded-xl bg-purple-500 border border-purple-400 text-white text-xs font-bold flex items-center gap-1.5 transition-all shadow-md shadow-purple-500/30'
        : 'px-3 py-1.5 rounded-xl bg-purple-500/10 border border-purple-500/30 text-purple-300 hover:bg-purple-500/20 text-xs font-bold flex items-center gap-1.5 transition-all';
      showToast(isAiBotActive ? 'تم تفعيل الرد الآلي' : 'تم إيقاف الرد الآلي', false);
    });

    soundToggleBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      soundIcon.className = isMuted ? 'ph-bold ph-bell-slash text-base text-rose-400' : 'ph-bold ph-bell text-base';
      showToast(isMuted ? 'تم كتم التنبيهات' : 'تم تفعيل الأصوات', false);
    });

    clearChatBtn.addEventListener('click', () => {
      messagesContainer.innerHTML = '';
      emptyState.classList.remove('hidden');
      messagesContainer.appendChild(emptyState);
      showToast('تم مسح الرسائل محلياً', false);
    });

    window.onload = function() {
      initStorage();
      try {
        initChatChannel();
      } catch (e) {
        loadRoomMessages();
      }

      // Hybrid Polling Interval (every 3s)
      setInterval(() => {
        const currentRoom = roomInput.value.trim() || 'general';
        supabaseClient
          .from('messages')
          .select('*')
          .or(`receiver.eq.${currentRoom},receiver.is.null`)
          .order('created_at', { ascending: true })
          .then(({ data, error }) => {
            if (!error && data) {
              data.forEach(renderMessage);
            }
          });
      }, 3000);
    };
  </script>
</body>
</html>
