<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>نظام المحادثة المتقدم Ultra Chat Pro</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="chat-app">
    <!-- الشريط العلوي الرئيسي -->
    <header class="chat-header">
      <div class="header-top">
        <div class="brand">
          <span class="status-indicator" id="statusIndicator"></span>
          <h2>Ultra Chat Pro</h2>
        </div>
        <div class="header-actions">
          <button id="soundToggle" class="icon-btn" title="تبديل الصوت">🔔</button>
        </div>
      </div>
      
      <div class="config-bar">
        <div class="input-field">
          <label>اسمك:</label>
          <input type="text" id="username" placeholder="مثال: محمد" autocomplete="off">
        </div>
        <div class="input-field">
          <label>الغرفة:</label>
          <input type="text" id="roomInput" placeholder="عامة (general)" value="general" autocomplete="off">
        </div>
      </div>
    </header>

    <!-- شريط التنبيهات -->
    <div id="toast" class="toast-notification hidden"></div>

    <!-- منطقة عرض المحادثة -->
    <main id="messagesContainer" class="messages-container">
      <div id="loadingSpinner" class="spinner"></div>
      <div id="emptyState" class="empty-state hidden">لا توجد رسائل في هذه الغرفة بعد. كن أول من يرسل!</div>
    </main>

    <!-- شريط الإدخال ومؤشر الكتابة -->
    <footer class="chat-footer">
      <div id="typingIndicator" class="typing-indicator hidden">
        <span></span><span></span><span></span> <small>أحدهم يكتب الآن...</small>
      </div>
      <div class="input-controls">
        <textarea id="messageInput" placeholder="اكتب رسالتك..." rows="1" autocomplete="off"></textarea>
        <button id="sendBtn" class="send-btn" disabled>
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
