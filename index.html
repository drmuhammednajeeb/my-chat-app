<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1c24">
<title>Ultra Chat Pro</title>
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
:root{
  --bg:#0f1c24; --surface:#16262f; --raised:#1d313c; --line:#2a424f;
  --text:#eee8da; --muted:#8fa3ad; --mine:#1f7a72; --accent:#e8b04a;
}
*{font-family:'Tajawal',system-ui,sans-serif;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text)}
body{display:flex;align-items:center;justify-content:center}
.app{width:100%;height:100dvh;max-width:880px;background:var(--surface);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:768px){.app{height:94dvh;border-radius:24px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.45)}}
.field{background:var(--bg);border:1px solid var(--line);border-radius:12px;transition:border-color .2s}
.field:focus-within{border-color:var(--accent)}
.field input,.field textarea{background:transparent;border:0;outline:0;color:var(--text);width:100%}
.field input::placeholder,.field textarea::placeholder{color:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--raised);color:var(--muted);transition:.15s}
.icon-btn:hover{color:var(--text)}
.icon-btn[aria-pressed="true"]{background:var(--accent);color:#1b1403}
.icon-btn:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#feed{scroll-behavior:smooth;overscroll-behavior:contain}
.msg{animation:in .22s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bubble{border-radius:18px;padding:8px 12px;font-size:.92rem;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble.mine{background:var(--mine);color:#fff}
.bubble.other{background:var(--raised);border:1px solid var(--line)}
.bubble.bot{background:#2b2616;border:1px solid #5a4a1e;color:#f3e3b5}
.bubble.mine.first{border-top-left-radius:6px}
.bubble.other.first,.bubble.bot.first{border-top-right-radius:6px}
.dot{animation:blink 1.3s infinite ease-in-out both}
.dot:nth-child(2){animation-delay:.18s}.dot:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.skel{background:linear-gradient(90deg,var(--raised),var(--line),var(--raised));background-size:200% 100%;animation:sh 1.4s infinite;border-radius:16px}
@keyframes sh{to{background-position:-200% 0}}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <header class="px-4 pt-3 pb-3 shrink-0 border-b" style="border-color:var(--line);padding-top:max(.75rem,env(safe-area-inset-top))">
    <div class="flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <div class="relative shrink-0">
          <div class="w-11 h-11 rounded-2xl grid place-items-center text-xl" style="background:var(--accent);color:#1b1403"><i class="ph-bold ph-chats-circle"></i></div>
          <span id="statusDot" class="absolute -bottom-0.5 -left-0.5 w-3.5 h-3.5 rounded-full border-2" style="background:#6b7c85;border-color:var(--surface)"></span>
        </div>
        <div class="min-w-0">
          <h1 class="font-extrabold text-base leading-tight truncate"># <span id="roomTitle">general</span></h1>
          <p id="statusText" class="text-xs" style="color:var(--muted)">جارٍ الاتصال…</p>
        </div>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button id="botBtn" class="icon-btn" aria-pressed="false" title="الرد الآلي التجريبي" aria-label="الرد الآلي"><i class="ph-bold ph-robot"></i></button>
        <button id="soundBtn" class="icon-btn" aria-pressed="false" title="كتم الصوت" aria-label="كتم الصوت"><i id="soundIcon" class="ph-bold ph-bell"></i></button>
        <button id="hideBtn" class="icon-btn" title="إخفاء الرسائل الحالية من شاشتي فقط" aria-label="إخفاء الرسائل محلياً"><i class="ph-bold ph-eraser"></i></button>
      </div>
    </div>
    <div class="grid grid-cols-2 gap-2 mt-3">
      <label class="field px-3 py-2 flex items-center gap-2 text-sm"><i class="ph-bold ph-user-circle" style="color:var(--muted)"></i>
        <input id="nameInput" maxlength="24" placeholder="اسمك" autocomplete="off" aria-label="اسمك"></label>
      <label class="field px-3 py-2 flex items-center gap-2 text-sm"><i class="ph-bold ph-hash" style="color:var(--muted)"></i>
        <input id="roomInput" maxlength="30" placeholder="general" autocomplete="off" aria-label="اسم الغرفة"></label>
    </div>
  </header>

  <div id="toast" role="status" aria-live="polite" class="absolute left-1/2 -translate-x-1/2 top-24 z-30 px-4 py-2 rounded-full text-xs font-bold shadow-lg opacity-0 pointer-events-none transition-opacity duration-200"></div>

  <main id="feed" class="flex-1 overflow-y-auto px-4 py-4 flex flex-col" aria-live="polite"></main>

  <button id="jumpBtn" class="hidden absolute z-20 left-4 bottom-28 h-10 px-3 rounded-full items-center gap-2 text-xs font-bold shadow-lg" style="background:var(--accent);color:#1b1403">
    <i class="ph-bold ph-arrow-down"></i><span id="jumpCount"></span>
  </button>

  <div id="typing" class="px-5 h-6 flex items-center gap-2 text-xs opacity-0 transition-opacity" style="color:var(--muted)">
    <span class="flex gap-1"><i class="dot w-1.5 h-1.5 rounded-full" style="background:var(--accent)"></i><i class="dot w-1.5 h-1.5 rounded-full" style="background:var(--accent)"></i><i class="dot w-1.5 h-1.5 rounded-full" style="background:var(--accent)"></i></span>
    <span id="typingText"></span>
  </div>

  <div id="attach" class="hidden px-4 py-2 items-center justify-between border-t" style="border-color:var(--line);background:var(--bg)">
    <div class="flex items-center gap-3"><img id="attachImg" alt="" class="w-11 h-11 rounded-lg object-cover"><span id="attachInfo" class="text-xs" style="color:var(--muted)"></span></div>
    <button id="attachCancel" class="text-xs font-bold px-2 py-1" style="color:#f08a8a">إزالة</button>
  </div>

  <footer class="px-3 pt-2 border-t shrink-0" style="border-color:var(--line);padding-bottom:max(.75rem,env(safe-area-inset-bottom))">
    <div class="flex items-end gap-2">
      <label class="icon-btn cursor-pointer shrink-0" style="width:44px;height:44px" title="إرفاق صورة"><i class="ph-bold ph-image text-lg"></i>
        <input type="file" id="fileInput" accept="image/*" class="hidden"></label>
      <div class="field flex-1 px-3 py-2.5 rounded-2xl"><textarea id="msgInput" rows="1" maxlength="2000" placeholder="اكتب رسالة…" class="text-sm resize-none block max-h-32" aria-label="نص الرسالة"></textarea></div>
      <button id="sendBtn" disabled class="shrink-0 grid place-items-center rounded-2xl transition disabled:opacity-35 disabled:cursor-not-allowed active:scale-95" style="width:44px;height:44px;background:var(--mine);color:#fff" aria-label="إرسال"><i class="ph-bold ph-paper-plane-tilt text-lg" style="transform:scaleX(-1)"></i></button>
    </div>
  </footer>
</div>

<div id="lightbox" class="hidden fixed inset-0 z-50 bg-black/85 p-4 items-center justify-center cursor-zoom-out"><img id="lightboxImg" alt="" class="max-w-full max-h-full rounded-xl"></div>

<script>
'use strict';
/* ========== Config ========== */
const CONFIG = {
  SUPABASE_URL: 'https://lvkeohpuocuklagvwpnq.supabase.co',
  SUPABASE_KEY: 'sb_publishable_3OM0vlZU0dkqK4X6aoGZsA_ZBawbyDR',
  TABLE: 'messages',
  PAGE_SIZE: 100,
  MAX_DOM_MESSAGES: 300,
  GROUP_WINDOW_MS: 5 * 60 * 1000,
  TYPING_THROTTLE_MS: 1500,
  TYPING_HIDE_MS: 2500,
  POLL_FALLBACK_MS: 4000,
  IMG_MAX_SIDE: 1280,
  IMG_QUALITY: 0.72,
  BOT_NAME: 'المساعد الآلي'
};

/* ========== DOM ========== */
const $ = id => document.getElementById(id);
const el = { feed:$('feed'), name:$('nameInput'), room:$('roomInput'), msg:$('msgInput'), send:$('sendBtn'),
  dot:$('statusDot'), status:$('statusText'), title:$('roomTitle'), typing:$('typing'), typingText:$('typingText'),
  toast:$('toast'), file:$('fileInput'), attach:$('attach'), attachImg:$('attachImg'), attachInfo:$('attachInfo'),
  attachCancel:$('attachCancel'), bot:$('botBtn'), sound:$('soundBtn'), soundIcon:$('soundIcon'), hide:$('hideBtn'),
  jump:$('jumpBtn'), jumpCount:$('jumpCount'), lightbox:$('lightbox'), lightboxImg:$('lightboxImg') };

/* ========== State ========== */
const state = {
  room: 'general', muted: false, bot: false, image: null, unread: 0, sending: false,
  channel: null, connected: false, lastTs: null, lastSender: null, lastTime: 0, lastDay: '',
  seen: new Set(), typingHide: null, lastTypingSent: 0, pollTimer: null, loadToken: 0,
};
const db = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);

/* ========== Utils ========== */
const store = {
  get(k, d = '') { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const cleanRoom = v => (v || '').trim().replace(/[^\p{L}\p{N}_-]+/gu, '-').replace(/^-+|-+$/g, '').slice(0, 30) || 'general';
const currentUser = () => el.name.value.trim();
const isNearBottom = () => el.feed.scrollHeight - el.feed.scrollTop - el.feed.clientHeight < 120;
const scrollBottom = (smooth = false) => el.feed.scrollTo({ top: el.feed.scrollHeight, behavior: smooth ? 'smooth' : 'auto' });
const fmtTime = d => d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });
const fmtDay = d => {
  const t = new Date(), y = new Date(Date.now() - 864e5);
  if (d.toDateString() === t.toDateString()) return 'اليوم';
  if (d.toDateString() === y.toDateString()) return 'أمس';
  return d.toLocaleDateString('ar-SA', { weekday: 'long', day: 'numeric', month: 'long' });
};
const PALETTE = ['#e8b04a', '#6fc3b2', '#e58f7a', '#9db7f0', '#c9a0e8', '#a6d17a', '#f0a3c3'];
const colorFor = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const safeImg = u => typeof u === 'string' && (/^data:image\/(png|jpe?g|gif|webp);base64,/.test(u) || /^https:\/\//.test(u));
function h(tag, cls = '', text = '') { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }

/* ========== UI: toast, sound, status ========== */
let toastTimer;
function toast(text, ok = false) {
  el.toast.textContent = text;
  el.toast.style.background = ok ? '#2f8f6a' : '#c0504d';
  el.toast.style.color = '#fff';
  el.toast.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (el.toast.style.opacity = '0'), 3000);
}

let audioCtx;
function beep(freq = 587) {
  if (state.muted) return;
  try {
    audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = audioCtx.currentTime;
    o.frequency.value = freq; g.gain.setValueAtTime(0.07, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + 0.18);
  } catch {}
}

function setStatus(kind) {
  const map = { live: ['#3fbf8f', 'متصل مباشرة'], poll: ['#e8b04a', 'تحديث تلقائي'], wait: ['#6b7c85', 'جارٍ الاتصال…'], off: ['#d9534f', 'لا يوجد اتصال'] };
  const [c, t] = map[kind];
  el.dot.style.background = c; el.status.textContent = t;
}

/* ========== UI: rendering ========== */
function showEmpty() {
  el.feed.replaceChildren();
  const box = h('div', 'm-auto text-center py-12');
  box.append(h('div', 'text-4xl mb-3', '💬'), h('p', 'font-bold', 'لا رسائل في هذه الغرفة بعد'),
    h('p', 'text-xs mt-1', 'اكتب أول رسالة لتبدأ المحادثة.'));
  box.lastChild.style.color = 'var(--muted)';
  box.id = 'empty';
  el.feed.append(box);
}
function showSkeleton() {
  el.feed.replaceChildren();
  [['60%', 'self-start'], ['45%', 'self-end'], ['70%', 'self-start'], ['38%', 'self-end']].forEach(([w, s]) => {
    const n = h('div', `skel h-12 mb-3 ${s}`); n.style.width = w; el.feed.append(n);
  });
}

function renderMessage(m, { silent = false } = {}) {
  if (!m || (m.id != null && state.seen.has(m.id))) return;
  if (m.id != null) state.seen.add(m.id);
  if (m.created_at && (!state.lastTs || m.created_at > state.lastTs)) state.lastTs = m.created_at;

  const stickBottom = isNearBottom();
  $('empty')?.remove();
  if (el.feed.querySelector('.skel')) el.feed.replaceChildren();

  const date = m.created_at ? new Date(m.created_at) : new Date();
  const day = date.toDateString();
  if (day !== state.lastDay) {
    const sep = h('div', 'self-center text-[11px] px-3 py-1 rounded-full my-3', fmtDay(date));
    sep.style.cssText = 'background:var(--raised);color:var(--muted)';
    el.feed.append(sep); state.lastDay = day; state.lastSender = null;
  }

  const me = currentUser();
  const sender = m.sender || 'مجهول';
  const mine = sender === me;
  const bot = sender === CONFIG.BOT_NAME;
  const first = state.lastSender !== sender || date - state.lastTime > CONFIG.GROUP_WINDOW_MS;
  state.lastSender = sender; state.lastTime = +date;

  const row = h('div', `msg flex flex-col max-w-[84%] md:max-w-[70%] ${mine ? 'items-start self-start' : 'items-end self-end'} ${first ? 'mt-3' : 'mt-1'}`);
  row.style.alignItems = mine ? 'flex-start' : 'flex-end';
  if (first && !mine) {
    const n = h('span', 'text-[11px] font-bold px-1 mb-1', (bot ? '🤖 ' : '') + sender);
    n.style.color = bot ? 'var(--accent)' : colorFor(sender); row.append(n);
  }
  const b = h('div', `bubble ${mine ? 'mine' : bot ? 'bot' : 'other'} ${first ? 'first' : ''}`);
  if (safeImg(m.image_url)) {
    const img = h('img', 'rounded-xl max-h-60 w-full object-cover mb-1.5 cursor-zoom-in');
    img.src = m.image_url; img.loading = 'lazy'; img.alt = 'صورة مرفقة';
    img.addEventListener('click', () => openLightbox(m.image_url));
    b.append(img);
  }
  if (m.content) b.append(document.createTextNode(m.content));
  const t = h('div', 'text-[10px] opacity-70 mt-0.5 text-left', fmtTime(date));
  t.style.direction = 'ltr'; t.style.textAlign = 'left';
  b.append(t); row.append(b); el.feed.append(row);

  while (el.feed.childElementCount > CONFIG.MAX_DOM_MESSAGES) el.feed.firstElementChild.remove();

  if (mine || stickBottom) scrollBottom(!silent);
  else { state.unread++; updateJump(); }
  if (!mine && !silent) beep(bot ? 880 : 587);
}

function updateJump() {
  const far = !isNearBottom();
  if (!far) state.unread = 0;
  el.jump.classList.toggle('hidden', !far);
  el.jump.classList.toggle('flex', far);
  el.jumpCount.textContent = state.unread ? `${state.unread} جديدة` : 'للأسفل';
}
function openLightbox(src) { el.lightboxImg.src = src; el.lightbox.classList.remove('hidden'); el.lightbox.classList.add('flex'); }

/* ========== Data layer ========== */
const roomFilter = r => `receiver.eq.${r},receiver.is.null`;

async function loadRoom() {
  const token = ++state.loadToken, room = state.room;
  state.seen.clear(); state.lastTs = null; state.lastSender = null; state.lastDay = ''; state.unread = 0;
  showSkeleton(); updateJump();

  const { data, error } = await db.from(CONFIG.TABLE).select('*').or(roomFilter(room))
    .order('created_at', { ascending: false }).limit(CONFIG.PAGE_SIZE);
  if (token !== state.loadToken) return;                 // user switched rooms meanwhile
  if (error) { showEmpty(); toast('تعذر جلب الرسائل — تحقق من الاتصال'); return; }
  if (!data.length) return showEmpty();
  el.feed.replaceChildren();
  data.reverse().forEach(m => renderMessage(m, { silent: true }));
  scrollBottom(); state.unread = 0; updateJump();
}

async function syncNew() {                               // incremental fallback, fetches only newer rows
  if (!state.lastTs) return;
  const token = state.loadToken;
  const { data, error } = await db.from(CONFIG.TABLE).select('*').or(roomFilter(state.room))
    .gt('created_at', state.lastTs).order('created_at', { ascending: true });
  if (!error && data && token === state.loadToken) data.forEach(m => renderMessage(m));
}

async function insertMessage(payload) {
  const { data, error } = await db.from(CONFIG.TABLE).insert([payload]).select().single();
  if (!error && data) renderMessage(data);              // instant echo; realtime duplicate is ignored by id
  return { data, error };
}

/* ========== Realtime ========== */
function connect() {
  if (state.channel) db.removeChannel(state.channel);
  state.connected = false; setStatus('wait'); updatePolling();
  const room = state.room;
  state.channel = db.channel(`room:${room}`, { config: { broadcast: { self: false } } })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: CONFIG.TABLE }, ({ new: m }) => {
      if (m.receiver == null || m.receiver === state.room) renderMessage(m);   // room filter was missing before
    })
    .on('broadcast', { event: 'typing' }, ({ payload }) => {
      if (payload?.sender && payload.sender !== currentUser()) showTyping(payload.sender);
    })
    .subscribe(status => {
      state.connected = status === 'SUBSCRIBED';
      setStatus(state.connected ? 'live' : (navigator.onLine ? 'poll' : 'off'));
      updatePolling();
      if (state.connected) syncNew();                    // catch anything missed while reconnecting
    });
  loadRoom();
}

function updatePolling() {                                // poll only while realtime is down
  clearInterval(state.pollTimer);
  if (!state.connected) state.pollTimer = setInterval(syncNew, CONFIG.POLL_FALLBACK_MS);
}

function showTyping(who) {
  el.typingText.textContent = `${who} يكتب الآن…`;
  el.typing.style.opacity = '1';
  clearTimeout(state.typingHide);
  state.typingHide = setTimeout(() => (el.typing.style.opacity = '0'), CONFIG.TYPING_HIDE_MS);
}
function sendTyping() {
  const now = Date.now();
  if (!state.connected || now - state.lastTypingSent < CONFIG.TYPING_THROTTLE_MS) return;
  state.lastTypingSent = now;
  state.channel.send({ type: 'broadcast', event: 'typing', payload: { sender: currentUser() } }).catch(() => {});
}

/* ========== Images ========== */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, CONFIG.IMG_MAX_SIDE / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', CONFIG.IMG_QUALITY));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('bad image')); };
    img.src = url;
  });
}
function clearAttachment() {
  state.image = null; el.file.value = ''; el.attach.classList.add('hidden'); el.attach.classList.remove('flex'); validate();
}

/* ========== Actions ========== */
function validate() {
  el.send.disabled = state.sending || !currentUser() || !(el.msg.value.trim() || state.image);
}
function autosize() { el.msg.style.height = 'auto'; el.msg.style.height = Math.min(el.msg.scrollHeight, 128) + 'px'; }

async function sendMessage() {
  const sender = currentUser(), content = el.msg.value.trim(), image = state.image;
  if (!sender) return toast('اكتب اسمك أولاً');
  if (!content && !image) return;
  state.sending = true; validate();

  const payload = { sender, receiver: state.room, content };
  if (image) payload.image_url = image;
  const { error } = await insertMessage(payload);
  state.sending = false;

  if (error) { toast('تعذر الإرسال — رسالتك محفوظة، أعد المحاولة'); validate(); return; }
  el.msg.value = ''; autosize(); clearAttachment(); el.msg.focus();
  if (state.bot && content) setTimeout(() => botReply(), 1000);
}

async function botReply() {
  const lines = ['وصلتني رسالتك ✅', 'الاتصال اللحظي يعمل بشكل سليم.', `تم تسجيل نشاطك في غرفة ${state.room}.`, 'هذا رد تجريبي لاختبار سرعة الإرسال والاستقبال.'];
  await insertMessage({ sender: CONFIG.BOT_NAME, receiver: state.room, content: lines[Math.floor(Math.random() * lines.length)] });
}

function changeRoom() {
  const room = cleanRoom(el.room.value);
  el.room.value = room;
  if (room === state.room && state.channel) return;
  state.room = room; el.title.textContent = room; store.set('ucp_room', room);
  connect();
}

/* ========== Events ========== */
el.name.addEventListener('input', () => { store.set('ucp_user', el.name.value.trim()); validate(); });
el.room.addEventListener('change', changeRoom);
el.room.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); el.room.blur(); } });
el.msg.addEventListener('input', () => { autosize(); validate(); if (el.msg.value) sendTyping(); });
el.msg.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!el.send.disabled) sendMessage(); }
});
el.send.addEventListener('click', sendMessage);

el.file.addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    state.image = await compressImage(f);
    el.attachImg.src = state.image;
    el.attachInfo.textContent = `صورة جاهزة (${Math.round(state.image.length * 0.75 / 1024)} ك.ب بعد الضغط)`;
    el.attach.classList.remove('hidden'); el.attach.classList.add('flex'); validate();
  } catch { toast('تعذر قراءة الصورة'); clearAttachment(); }
});
el.attachCancel.addEventListener('click', clearAttachment);

el.bot.addEventListener('click', () => {
  state.bot = !state.bot; el.bot.setAttribute('aria-pressed', state.bot);
  toast(state.bot ? 'الرد الآلي التجريبي مفعّل' : 'تم إيقاف الرد الآلي', true);
});
el.sound.addEventListener('click', () => {
  state.muted = !state.muted; store.set('ucp_muted', state.muted ? '1' : '');
  el.sound.setAttribute('aria-pressed', state.muted);
  el.soundIcon.className = `ph-bold ${state.muted ? 'ph-bell-slash' : 'ph-bell'}`;
  toast(state.muted ? 'تم كتم التنبيهات' : 'تم تفعيل التنبيهات', true);
});
el.hide.addEventListener('click', () => { showEmpty(); toast('أُخفيت الرسائل من شاشتك فقط', true); });
el.feed.addEventListener('scroll', updateJump, { passive: true });
el.jump.addEventListener('click', () => { scrollBottom(true); state.unread = 0; updateJump(); });
el.lightbox.addEventListener('click', () => { el.lightbox.classList.add('hidden'); el.lightbox.classList.remove('flex'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') el.lightbox.click(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncNew(); });
window.addEventListener('online', () => { toast('عاد الاتصال', true); connect(); });
window.addEventListener('offline', () => { setStatus('off'); toast('انقطع الاتصال بالإنترنت'); });

/* ========== Init ========== */
(function init() {
  el.name.value = store.get('ucp_user');
  state.room = cleanRoom(store.get('ucp_room', 'general'));
  el.room.value = state.room; el.title.textContent = state.room;
  state.muted = !!store.get('ucp_muted');
  if (state.muted) { el.sound.setAttribute('aria-pressed', 'true'); el.soundIcon.className = 'ph-bold ph-bell-slash'; }
  validate(); connect();
  if (!el.name.value) el.name.focus();
})();
</script>
</body>
</html>
