name: Message lifecycle regression

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: message-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-contract-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Run source-contract regression checks
        run: node --test tests/message-lifecycle.test.mjs tests/membership-number-format.test.mjs
      - name: Syntax-check membership administration module
        run: node --check membership.js
      - name: Install isolated browser test dependency
        run: npm install --no-save --no-package-lock playwright@1.65.0
      - name: Install Chromium
        run: ./node_modules/.bin/playwright install --with-deps chromium
      - name: Run browser integration regression checks
        run: node --test tests/e2e/message-lifecycle.browser.test.mjs
