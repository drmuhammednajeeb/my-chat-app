name: Disposable local Supabase runtime verification

on:
  push:
    branches:
      - "engineering/stability-css-extraction-20261109"
      - "rebuild/clean-core-20261111"
  pull_request:
    branches:
      - "engineering/stability-css-extraction-20261109"
      - "rebuild/clean-core-20261111"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disposable-local-supabase-runtime-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  local-supabase-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run direct-conversation static regression tests
        run: |
          node --test \
            tests/staging/local-supabase/direct-conversation-eligibility-guard.test.mjs \
            tests/staging/local-supabase/direct-conversation-eligibility-runtime.test.mjs \
            tests/staging/local-supabase/direct-conversation-concurrency.test.mjs \\\n            tests/staging/local-supabase/local-chat-e2e.browser.guard.test.mjs

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Install pinned browser E2E dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 @supabase/supabase-js@2.49.1
          npx playwright install --with-deps chromium

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create an isolated temporary Supabase project
        env:
          RUNTIME_PROJECT_DIR: ${{ runner.temp }}/my-chat-app-supabase-runtime
        run: |
          mkdir -p "$RUNTIME_PROJECT_DIR"
          cd "$RUNTIME_PROJECT_DIR"
          supabase init
          mkdir -p supabase/migrations
          find supabase/migrations -type f -name '*.sql' -delete
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = process.env.RUNTIME_PROJECT_DIR + '/supabase/config.toml';
          let config = fs.readFileSync(file, 'utf8');
          if (/^major_version\s*=\s*\d+/m.test(config)) {
            config = config.replace(/^major_version\s*=\s*\d+/m, 'major_version = 17');
          } else {
            config += '\n[db]\nmajor_version = 17\n';
          }
          fs.writeFileSync(file, config);
          NODE

      - name: Start disposable Supabase and execute the reviewed replay
        env:
          RUNTIME_PROJECT_DIR: ${{ runner.temp }}/my-chat-app-supabase-runtime
          ALLOW_DISPOSABLE_LOCAL_REPLAY: "1"
        run: |
          cd "$RUNTIME_PROJECT_DIR"
          if ! supabase start --exclude studio,edge-runtime,logflare,vector,supavisor,postgres-meta > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            cat "$RUNNER_TEMP/supabase-start.log"
            exit 1
          fi
          supabase status -o env > "$RUNNER_TEMP/supabase-runtime.env"
          set -a
          . "$RUNNER_TEMP/supabase-runtime.env"
          set +a
          test -n "$API_URL"
          test -n "$DB_URL"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          export LOCAL_SUPABASE_URL="$API_URL"
          export LOCAL_SUPABASE_DB_URL="$DB_URL"
          export LOCAL_SUPABASE_ANON_KEY="$ANON_KEY"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export LOCAL_SYNTHETIC_AUTH_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(32).toString('hex') + '!aA9')")"
          cd "$GITHUB_WORKSPACE"
          node tests/staging/local-supabase/local-supabase-replay-runtime.mjs
          node tests/staging/local-supabase/local-chat-e2e.browser.mjs

      - name: Stop and destroy the disposable Supabase stack
        if: always()
        env:
          RUNTIME_PROJECT_DIR: ${{ runner.temp }}/my-chat-app-supabase-runtime
        run: |
          if [ -d "$RUNTIME_PROJECT_DIR" ]; then
            cd "$RUNTIME_PROJECT_DIR"
            supabase stop || true
          fi
