name: Disposable local Supabase runtime verification

on:
  push:
    branches:
      - "engineering/stability-css-extraction-20261109"
  pull_request:
    branches:
      - "engineering/stability-css-extraction-20261109"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disposable-local-supabase-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-supabase-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Run direct-conversation static regression tests
        run: |
          node --test \
            tests/staging/local-supabase/direct-conversation-eligibility-guard.test.mjs \
            tests/staging/local-supabase/direct-conversation-eligibility-runtime.test.mjs \
            tests/staging/local-supabase/direct-conversation-concurrency.test.mjs

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb
        with:
          version: 3.0.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create an isolated temporary Supabase project
        env:
          RUNTIME_PROJECT_DIR: ${{ runner.temp }}/my-chat-app-supabase-runtime
        run: |
          mkdir -p "$RUNTIME_PROJECT_DIR"
          cd "$RUNTIME_PROJECT_DIR"
          supabase init
          mkdir -p supabase/migrations
          find supabase/migrations -type f -name '*.sql' -delete
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = process.env.RUNTIME_PROJECT_DIR + '/supabase/config.toml';
          const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/);
          const dbHeader = lines.findIndex(line => /^\s*\[db\]\s*$/.test(line));
          if (dbHeader === -1) {
            lines.push('', '[db]', 'major_version = 17');
          } else {
            let dbEnd = lines.length;
            for (let index = dbHeader + 1; index < lines.length; index += 1) {
              if (/^\s*\[[^\]]+\]\s*$/.test(lines[index])) {
                dbEnd = index;
                break;
              }
            }
            const majorVersion = lines.findIndex((line, index) =>
              index > dbHeader && index < dbEnd && /^\s*major_version\s*=/.test(line)
            );
            if (majorVersion >= 0) {
              lines[majorVersion] = 'major_version = 17';
            } else {
              lines.splice(dbHeader + 1, 0, 'major_version = 17');
            }
          }
          fs.writeFileSync(file, lines.join('\n') + '\n');
          NODE

      - name: Start disposable Supabase and execute the reviewed replay
        env:
          RUNTIME_PROJECT_DIR: ${{ runner.temp }}/my-chat-app-supabase-runtime
          ALLOW_DISPOSABLE_LOCAL_REPLAY: "1"
        run: |
          cd "$RUNTIME_PROJECT_DIR"
          export SUPABASE_TELEMETRY_DISABLED=1
          export SUPABASE_UPDATE_DISABLED=1
          if ! supabase start --exclude studio,edge-runtime,logflare,vector,supavisor,postgres-meta,inbucket > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            cat "$RUNNER_TEMP/supabase-start.log"
            exit 1
          fi

          # Block outbound traffic from every Supabase container network while preserving
          # traffic between the local Supabase networks and host-to-loopback test requests.
          mapfile -t container_ids < <(docker ps -q)
          if [ "${#container_ids[@]}" -eq 0 ]; then
            echo "No Supabase containers found; refusing to run without egress isolation."
            exit 1
          fi
          network_names=$(docker inspect "${container_ids[@]}" --format '{{range $name, $network := .NetworkSettings.Networks}}{{println $name}}{{end}}' | sort -u)
          if [ -z "$network_names" ]; then
            echo "No Docker networks found; refusing to run without egress isolation."
            exit 1
          fi
          if printf '%s\n' "$network_names" | grep -Eq '^(host|none)$'; then
            echo "A Supabase container uses a non-bridge network; refusing to run without egress isolation."
            exit 1
          fi
          declare -a network_subnets=()
          while IFS= read -r network; do
            [ -n "$network" ] || continue
            ipv6_enabled=$(docker network inspect "$network" --format '{{.EnableIPv6}}')
            if [ "$ipv6_enabled" = "true" ]; then
              echo "IPv6-enabled Supabase network is not supported by this egress guard: $network"
              exit 1
            fi
            while IFS= read -r subnet; do
              [ -n "$subnet" ] || continue
              case "$subnet" in
                *:*) echo "IPv6 subnet is not supported by this egress guard: $subnet"; exit 1 ;;
              esac
              network_subnets+=("$subnet")
            done < <(docker network inspect "$network" --format '{{range .IPAM.Config}}{{println .Subnet}}{{end}}')
          done <<< "$network_names"
          if [ "${#network_subnets[@]}" -eq 0 ]; then
            echo "No IPv4 Docker subnets found; refusing to run without egress isolation."
            exit 1
          fi
          sudo iptables -S DOCKER-USER >/dev/null
          sudo iptables -N SUPABASE_EGRESS_GUARD
          for source_subnet in "${network_subnets[@]}"; do
            for destination_subnet in "${network_subnets[@]}"; do
              sudo iptables -A SUPABASE_EGRESS_GUARD -s "$source_subnet" -d "$destination_subnet" -j RETURN
            done
            sudo iptables -A SUPABASE_EGRESS_GUARD -s "$source_subnet" -j DROP
          done
          sudo iptables -A SUPABASE_EGRESS_GUARD -j RETURN
          sudo iptables -I DOCKER-USER 1 -j SUPABASE_EGRESS_GUARD
          echo "SUPABASE_CONTAINER_EGRESS_ISOLATION=ENFORCED"
          printf '%s\n' "${network_subnets[@]}" > "$RUNNER_TEMP/supabase-egress-subnets.txt"

          supabase status -o env > "$RUNNER_TEMP/supabase-runtime.env"
          set -a
          . "$RUNNER_TEMP/supabase-runtime.env"
          set +a
          test -n "$API_URL"
          test -n "$DB_URL"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          export LOCAL_SUPABASE_URL="$API_URL"
          export LOCAL_SUPABASE_DB_URL="$DB_URL"
          export LOCAL_SUPABASE_ANON_KEY="$ANON_KEY"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          cd "$GITHUB_WORKSPACE"
          node tests/staging/local-supabase/local-supabase-replay-runtime.mjs

      - name: Stop and destroy the disposable Supabase stack
        if: always()
        env:
          RUNTIME_PROJECT_DIR: ${{ runner.temp }}/my-chat-app-supabase-runtime
        run: |
          if sudo iptables -C DOCKER-USER -j SUPABASE_EGRESS_GUARD 2>/dev/null; then
            sudo iptables -D DOCKER-USER -j SUPABASE_EGRESS_GUARD || true
          fi
          sudo iptables -F SUPABASE_EGRESS_GUARD 2>/dev/null || true
          sudo iptables -X SUPABASE_EGRESS_GUARD 2>/dev/null || true
          if [ -d "$RUNTIME_PROJECT_DIR" ]; then
            cd "$RUNTIME_PROJECT_DIR"
            supabase stop || true
          fi
