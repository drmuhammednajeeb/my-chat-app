name: Disposable local Supabase runtime verification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - "database/unify-migration-sources-20261112"
      - "engineering/stability-css-extraction-20261109"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disposable-local-supabase-runtime-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  local-supabase-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.0.0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create an isolated temporary Supabase project
        env:
          RUNTIME_PROJECT_DIR: ${{ runner.temp }}/my-chat-app-supabase-runtime
        run: |
          mkdir -p "$RUNTIME_PROJECT_DIR"
          cd "$RUNTIME_PROJECT_DIR"
          supabase init
          mkdir -p supabase/migrations
          find supabase/migrations -type f -name '*.sql' -delete
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const file = process.env.RUNTIME_PROJECT_DIR + '/supabase/config.toml';
          let config = fs.readFileSync(file, 'utf8');
          const runId = Number(process.env.GITHUB_RUN_ID);
          if (!Number.isSafeInteger(runId) || runId < 1) throw new Error('GITHUB_RUN_ID is required for isolated Supabase ports');
          const basePort = 20000 + (runId % 30000);
          function setTomlValue(source, section, key, value) {
            const header = '[' + section + ']';
            const sectionStart = source.indexOf(header);
            if (sectionStart < 0) throw new Error('Missing Supabase config section: ' + section);
            const contentStart = sectionStart + header.length;
            const remainder = source.slice(contentStart);
            const nextSectionOffset = remainder.search(/^\[[A-Za-z0-9_.-]+\]\s*$/m);
            const sectionEnd = nextSectionOffset < 0 ? source.length : contentStart + nextSectionOffset;
            let body = source.slice(contentStart, sectionEnd);
            const keyPattern = new RegExp('^\\s*' + key + '\\s*=.*$', 'm');
            if (keyPattern.test(body)) body = body.replace(keyPattern, key + ' = ' + value);
            else body += (body.endsWith('\n') ? '' : '\n') + key + ' = ' + value + '\n';
            return source.slice(0, contentStart) + body + source.slice(sectionEnd);
          }
          config = setTomlValue(config, 'api', 'port', basePort);
          config = setTomlValue(config, 'db', 'port', basePort + 1);
          config = setTomlValue(config, 'db', 'shadow_port', basePort + 2);
          config = setTomlValue(config, 'db', 'major_version', 17);
          config = setTomlValue(config, 'inbucket', 'port', basePort + 3);
          config = setTomlValue(config, 'inbucket', 'smtp_port', basePort + 4);
          config = setTomlValue(config, 'inbucket', 'pop3_port', basePort + 5);
          config = setTomlValue(config, 'analytics', 'port', basePort + 6);
          fs.writeFileSync(file, config);
          fs.appendFileSync(process.env.GITHUB_ENV, 'RUNTIME_BASE_PORT=' + basePort + '\n');
          NODE

      - name: Start disposable Supabase and execute the reviewed replay
        env:
          RUNTIME_PROJECT_DIR: ${{ runner.temp }}/my-chat-app-supabase-runtime
          ALLOW_DISPOSABLE_LOCAL_REPLAY: "1"
        run: |
          cd "$RUNTIME_PROJECT_DIR"
          if ! supabase start --exclude studio,edge-runtime,logflare,vector,supavisor,postgres-meta > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            cat "$RUNNER_TEMP/supabase-start.log"
            exit 1
          fi
          supabase status -o env > "$RUNNER_TEMP/supabase-runtime.env"
          set -a
          . "$RUNNER_TEMP/supabase-runtime.env"
          set +a
          test -n "$API_URL"
          test -n "$DB_URL"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          export LOCAL_SUPABASE_URL="$API_URL"
          export LOCAL_SUPABASE_DB_URL="$DB_URL"
          export LOCAL_SUPABASE_EXPECTED_API_PORT="$RUNTIME_BASE_PORT"
          export LOCAL_SUPABASE_EXPECTED_DB_PORT="$((RUNTIME_BASE_PORT + 1))"
          export LOCAL_SUPABASE_ANON_KEY="$ANON_KEY"
          export LOCAL_SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          cd "$GITHUB_WORKSPACE"
          node tests/staging/local-supabase/local-supabase-replay-runtime.mjs

      - name: Stop and destroy the disposable Supabase stack
        if: always()
        env:
          RUNTIME_PROJECT_DIR: ${{ runner.temp }}/my-chat-app-supabase-runtime
        run: |
          if [ -d "$RUNTIME_PROJECT_DIR" ]; then
            cd "$RUNTIME_PROJECT_DIR"
            supabase stop || true
          fi
