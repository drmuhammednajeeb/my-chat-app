name: PWA cache lifecycle

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-cache-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify service-worker lifecycle contracts
        run: node --test tests/service-worker-lifecycle.test.mjs tests/architecture-safety-contract.test.mjs
