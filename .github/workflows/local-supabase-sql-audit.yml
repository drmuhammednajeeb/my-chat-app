name: Local Supabase SQL manifest audit

on:
  push:
    branches:
      - "engineering/stability-css-extraction-20261109"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-sql-audit-\${{ github.ref }}
  cancel-in-progress: false

jobs:
  read-only-sql-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated read-only audit tests
        run: |
          node --test \
            tests/staging/local-supabase/audit-sql-manifest.test.mjs \
            tests/staging/local-supabase/bootstrap-guard.test.mjs \
            tests/staging/local-supabase/build-database-object-inventory.test.mjs \
            tests/staging/local-supabase/verify-test-only-sql-patches.test.mjs
      - name: Generate repository SQL object inventory
        run: |
          node tests/staging/local-supabase/build-database-object-inventory.mjs > "$RUNNER_TEMP/database-object-inventory.json"
          node --input-type=module -e "
            import fs from 'node:fs';
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/database-object-inventory.json', 'utf8'));
            console.log('INVENTORY_MODE=' + report.auditMode);
            console.log('SQL_FILES=' + report.sourceCounts.totalSqlFiles);
            console.log('CREATED_TABLES=' + report.inventoryTotals.createdTables);
            console.log('COLUMNS=' + report.inventoryTotals.columns);
            console.log('FOREIGN_KEYS=' + report.inventoryTotals.foreignKeys);
            console.log('GRANT_STATEMENTS=' + report.inventoryTotals.grantStatements);
            console.log('FUNCTION_DEFINITIONS=' + report.inventoryTotals.functionDefinitions);
            console.log('INDEXES=' + report.inventoryTotals.indexes);
            console.log('TRIGGERS=' + report.inventoryTotals.triggers);
            console.log('POLICIES=' + report.inventoryTotals.policies);
            console.log('DUPLICATE_GROUPS=' + report.duplicateGroups.length);
            console.log('UNRESOLVED_INTERNAL_FUNCTIONS=' + report.unresolvedInternalFunctions.join(','));
            console.log('MISSING_CLIENT_RPCS=' + report.missingClientRpcs.join(','));
            console.log('MEMBERSHIP_FORMAT_STATUS=' + report.membershipFormatReview.status);
            console.log('SQL_EXECUTION_AUTHORIZED=false');
            if (report.auditMode !== 'READ_ONLY_SOURCE_INVENTORY') process.exit(1);
          "
      - name: Run original SQL manifest audit
        run: |
          node tests/staging/local-supabase/audit-sql-manifest.mjs > "$RUNNER_TEMP/sql-audit-report.json"
          node --input-type=module -e "
            import fs from 'node:fs';
            const report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/sql-audit-report.json', 'utf8'));
            const blockers = report.findings.filter(item => item.severity === 'blocking');
            console.log('SQL_AUDIT_MODE=' + report.auditMode);
            console.log('MIGRATION_FILES=' + report.sourceDirectories[0].fileCount);
            console.log('HISTORICAL_SQL_FILES=' + report.sourceDirectories[1].fileCount);
            console.log('DUPLICATE_GROUPS=' + report.duplicateGroups.length);
            console.log('LEGACY_BLOCKERS=' + report.legacyBlockers.length);
            console.log('SYNTAX_HAZARDS=' + report.syntaxHazards.length);
            console.log('BOOTSTRAP_STATUS=' + report.bootstrap.status);
            for (const item of blockers) console.log('BLOCKER=' + item.code + ': ' + item.message);
            if (report.auditMode !== 'READ_ONLY' || report.bootstrap.executable !== false) process.exit(1);
          "
